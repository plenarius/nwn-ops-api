name: Tests

# The test suite on every pull request and on main, with the pinned packages (requirements.txt) on the image's Python.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPS_TEST_MARIADB: "root:test@127.0.0.1:3306"   # the tracing tests' database (the service below)
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned packages
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: The image builds
        run: docker build -q -t nwn-ops-api:ci .
